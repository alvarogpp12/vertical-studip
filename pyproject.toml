[project]
name = "showrunner-ia"
version = "0.1.0"
description = "Agente productor de series verticales 100% IA: idea -> biblia -> producción -> publicación"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pillow>=10.3",
  "opencv-python-headless>=4.10",
  "scenedetect>=0.6.4",
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1",
  "fal-client>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
showrunner = "showrunner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showrunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "RUF"]
ignore = [
  "B008",    # typer declara las opciones en los valores por defecto
  "RUF001",  # los textos llevan comillas y guiones tipográficos a propósito
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/showrunner/dominio/__init__.py" = ["F401"]
"src/showrunner/valida/__init__.py" = ["F401"]
"src/showrunner/providers/__init__.py" = ["F401"]
