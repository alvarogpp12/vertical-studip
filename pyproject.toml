[project]
name = "showrunner-ia"
version = "0.1.0"
description = "Agente productor de series verticales 100% IA: idea -> biblia -> producción -> publicación"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pillow>=10.3",
  "opencv-python-headless>=4.10",
  "scenedetect>=0.6.4",
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
showrunner = "showrunner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showrunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
