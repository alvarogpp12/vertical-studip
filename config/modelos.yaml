# Catálogo de modelos. Precios en USD por segundo generado (estimados 2026-09-11).
# Los límites (min/max duración, referencias, negativo) salen del OpenAPI de fal
# consultado el 2026-09-11: ver docs/conocimiento/04_apis_y_prompting.md.
# estado: confirmado = visto en la web del proveedor · estimado = fuente secundaria · verificar = rellenar/probar
# nivel: borrador | trabajo | clave  (el router elige el más barato del nivel pedido)

modelos:
  seedance-2.0-fast@byteplus:
    proveedor: byteplus
    model_env: ARK_MODEL_SEEDANCE_20_FAST
    nivel: borrador
    precio_seg: {480p: 0.040, 720p: 0.091}
    min_duracion: 4          # el contrato no admite menos
    max_duracion: 15
    referencias: {imagenes: 9, videos: 3, audios: 3}
    citas_posicionales: true  # "@Image1, @Image2…" dentro del prompt
    negativo: false           # no tiene campo negative_prompt
    estado: estimado

  seedance-2.0@byteplus:
    proveedor: byteplus
    model_env: ARK_MODEL_SEEDANCE_20
    nivel: trabajo
    precio_seg: {480p: 0.067, 720p: 0.151}
    min_duracion: 4
    max_duracion: 15
    referencias: {imagenes: 9, videos: 3, audios: 3}
    citas_posicionales: true
    negativo: false
    estado: estimado

  seedance-2.5@byteplus:
    proveedor: byteplus
    model_env: ARK_MODEL_SEEDANCE_25
    nivel: clave
    precio_seg: {480p: 0.103, 720p: 0.231}
    min_duracion: 4
    max_duracion: 30
    referencias: {imagenes: 30, videos: 10, audios: 10}
    citas_posicionales: true
    negativo: false
    estado: estimado

  kling-3.0-standard@fal:
    proveedor: fal
    endpoint: fal-ai/kling-video/v3/standard/image-to-video
    nivel: trabajo
    precio_seg: {720p: 0.126}
    min_duracion: 3
    max_duracion: 15
    referencias: {imagenes: 1, videos: 0, audios: 0}
    requiere_imagen_inicial: true   # start_image_url es obligatorio en este endpoint
    citas_posicionales: false       # usa @Element1 sobre `elements`, no @ImageN
    negativo: true                  # negative_prompt, por defecto "blur, distort, and low quality"
    prompt_max_caracteres: 2500
    estado: confirmado

  seedance-2.5@fal:
    proveedor: fal
    endpoint: bytedance/seedance-2.5/reference-to-video
    nivel: clave
    precio_seg: {480p: 0.2205, 720p: 0.473}
    min_duracion: 4
    max_duracion: 30
    referencias: {imagenes: 30, videos: 10, audios: 10}
    citas_posicionales: true
    negativo: false
    estado: confirmado   # respaldo si BytePlus no está disponible (2x más caro)

  mock:
    proveedor: mock
    nivel: borrador
    precio_seg: {480p: 0.0, 720p: 0.0}
    min_duracion: 1
    max_duracion: 30
    referencias: {imagenes: 50, videos: 10, audios: 10}
    estado: confirmado   # genera un clip de prueba local con ffmpeg, sin coste

# Modelos de imagen: hojas de personaje y localizaciones. Precio en USD por imagen.
# usos: hojas | localizaciones | props
modelos_imagen:
  nano-banana-pro@fal:
    proveedor: fal
    endpoint: fal-ai/nano-banana-pro/edit
    usos: [hojas]
    precio_img: 0.15
    referencias: {imagenes: 14}
    estado: verificar   # endpoint y precio sin confirmar con llamada real

  seedream-5.0-pro@fal:
    proveedor: fal
    endpoint: fal-ai/bytedance/seedream/v5/pro/edit
    usos: [localizaciones, props, hojas]
    precio_img: 0.0675
    precio_ref_extra: 0.0045
    referencias: {imagenes: 10}
    estado: verificar   # endpoint y precio sin confirmar con llamada real

  mock-imagen:
    proveedor: mock
    usos: [hojas, localizaciones, props]
    precio_img: 0.0
    referencias: {imagenes: 50}
    estado: confirmado   # imágenes locales con ffmpeg, sin coste

# Modelos de lenguaje (los agentes). Precio en USD por millón de tokens.
# Fuente: tabla de precios de la API de Claude. La lectura de caché cuesta ~0,1x
# y la escritura ~1,25x sobre el precio de entrada.
modelos_llm:
  claude-opus-5:
    precio_entrada_mtok: 5.0
    precio_salida_mtok: 25.0
    contexto: 1000000
    estado: confirmado

  claude-sonnet-5:
    precio_entrada_mtok: 2.0
    precio_salida_mtok: 10.0
    contexto: 1000000
    estado: confirmado

  claude-haiku-4-5:
    precio_entrada_mtok: 1.0
    precio_salida_mtok: 5.0
    contexto: 200000
    estado: confirmado
