name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
      - name: Dependencias
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests scripts evals
      - name: Tests
        run: uv run pytest -q
      - name: Evaluación del linter de prompts (golden set, sin red)
        run: uv run python evals/eval_director.py
      - name: Diagnóstico (sin claves)
        run: uv run showrunner modelos
